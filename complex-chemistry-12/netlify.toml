# Cấu hình Netlify
# - Web tĩnh, không cần bước build: thư mục publish là chính thư mục này.
# - Netlify Function (tạo đề bằng AI) nằm trong netlify/functions.
#   Function chỉ chạy khi deploy bằng Netlify CLI hoặc Git, KHÔNG chạy khi kéo thả.
# - Biến môi trường cần có trên Netlify: GEMINI_API_KEY (bí mật), GEMINI_MODEL.
[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "microphone=(self)"
